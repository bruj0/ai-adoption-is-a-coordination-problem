site_name: AI Adoption Is a Coordination Problem
site_description: How game theory can help companies turn isolated AI experiments into better ways of working.
site_url: https://bruj0.github.io/ai-adoption-is-a-coordination-problem
repo_url: https://github.com/bruj0/ai-adoption-is-a-coordination-problem
repo_name: bruj0/ai-adoption-is-a-coordination-problem
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/account-group-outline
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - panzoom:
      key: "alt"
      hint_location: "top"
      full_screen: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid_fences.fence_pre_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Essay: index.md
